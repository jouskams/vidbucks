<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; font-family: Georgia, "Times New Roman", serif; color: #fff; }
      .ball { position: absolute; left: 504px; top: 430px; width: 72px; height: 72px; border-radius: 50%;
        background: radial-gradient(circle at 36% 30%, rgba(255,255,255,.9), rgba(255,255,255,0) 55%), radial-gradient(circle at 62% 74%, rgba(0,0,0,.38), rgba(0,0,0,0) 62%), #fff;
        box-shadow: 0 0 90px #ffffff55; }
      .line { position: absolute; left: 0; right: 0; top: 1170px; text-align: center; font-size: 60px; letter-spacing: .5px; white-space: nowrap; }
      .ch { display: inline-block; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080" data-height="1920">
      <div id="ball" class="ball clip" data-start="0" data-duration="4" data-track-index="0"></div>
      <div id="line" class="line clip" data-start="0" data-duration="4" data-track-index="1"></div>
    </div>
    <script>
      // A Vidbucks "IconStory"-style beat, written for HyperFrames: a ball drops and settles, a serif caption types in character by character.
      const TEXT = "A closed sale. A team in sync.";
      const line = document.getElementById("line");
      TEXT.split("").forEach((c) => { const s = document.createElement("span"); s.className = "ch"; s.textContent = c === " " ? " " : c; line.appendChild(s); });
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#ball", { y: -600 }, { y: 0, duration: 0.9, ease: "bounce.out" }, 0.1);
      tl.to(".ch", { opacity: 1, y: 0, duration: 0.05, stagger: 0.045, ease: "none" }, 0.9);
      tl.to("#line", { opacity: 0, y: -26, duration: 0.4, ease: "power2.in" }, 3.4);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
